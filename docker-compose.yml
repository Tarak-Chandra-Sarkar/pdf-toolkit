services:
  backend:
    build:
      context: ./backend
    container_name: pdf-toolkit-backend
    ports:
      - "8000:8000"
    environment:
      APP_NAME: PDF Toolkit
      APP_VERSION: 1.0.0
      ENVIRONMENT: development
      DEBUG: "true"
      API_PREFIX: /api/v1
      HOST: 0.0.0.0
      PORT: 8000
      FRONTEND_URL: http://localhost:3000
      LOG_LEVEL: INFO
    volumes:
      - ./backend/app:/app/app
      - ./backend/tests:/app/tests
      - pdf_toolkit_data:/tmp/pdf-toolkit
    command:
      [
        "uvicorn",
        "app.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--reload"
      ]

  frontend:
    build:
      context: ./frontend
    container_name: pdf-toolkit-frontend
    ports:
      - "3000:3000"
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    command:
      [
        "npm",
        "run",
        "dev",
        "--",
        "--host",
        "0.0.0.0"
      ]